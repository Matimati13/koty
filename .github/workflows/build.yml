name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: bash setup.sh
      - run: python3 patch.py
      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - run: gradle assembleDebug --no-daemon
        working-directory: koty
      - run: cp koty/app/build/outputs/apk/debug/app-debug.apk Koty.apk
      - run: gh release create "apk-${{ github.run_number }}" Koty.apk --title "Koty ${{ github.run_number }}" --notes "Debug APK"
        env:
          GH_TOKEN: ${{ github.token }}
